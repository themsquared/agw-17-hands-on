# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  session:
    key: disabled   # demo only: v1.7 standalone always provisions a session key on first run (see README)
frontendPolicies:
  accessLog:
    add:
      agent.session: request.agent.session
llm:
  port: 4000
  models:
  - name: mock
    provider:
      custom:
        formats:
        - type: completions
    params:
      baseUrl: http://127.0.0.1:8091/v1
      model: mock-model
